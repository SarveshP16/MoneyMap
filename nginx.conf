server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses BrowserRouter (real paths, not #hashes) — any path
    # that isn't a real file falls back to index.html so client-side
    # routing can take over, e.g. refreshing on /transactions.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The sync backend — proxied same-origin so the frontend just calls
    # /api/state with no CORS setup, and every device only ever needs to
    # know one address (this one) regardless of what the backend
    # container's own address is.
    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Vite fingerprints built assets by content hash, so they're safe to
    # cache forever; index.html itself must always be revalidated or a
    # deploy would never actually reach anyone.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The service worker and manifest are plain (non-hashed) files under
    # public/ — the .js regex above would otherwise cache sw.js for a year,
    # which would mean a new one never actually reaches an open tab. Exact
    # `location =` blocks always win over the regex block regardless of
    # order, so these override it correctly.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
